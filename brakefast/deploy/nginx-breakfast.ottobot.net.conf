# breakfast.ottobot.net — BrakeFast React SPA (umgezogen von ottobot.net, 2026-07)
# Repo-Spiegel; Live-Datei: /etc/nginx/sites-available/breakfast.ottobot.net
# Certbot ergänzt nach Issuance den 443-Block + HTTP-Redirect.
server {
    server_name breakfast.ottobot.net;
    listen 80;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    root /docker/brakefast/react/dist;
    index index.html;

    location = /latest/data.json {
        alias /docker/openclaw-xfcd/data/brakefast-public/data.json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
    location = /latest/pipeline-telemetry.json {
        alias /docker/openclaw-xfcd/data/brakefast-public/pipeline-telemetry.json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
    location = /latest/monitoring.json {
        alias /docker/openclaw-xfcd/data/brakefast-public/monitoring.json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
    # Private Kalender-Titel — Key-Gating via conf.d/brakefast-key.conf ($arg_k-Map)
    location = /private/calendar.json {
        if ($brakefast_key_ok = 0) { return 403; }
        alias /docker/openclaw-xfcd/data/brakefast-public/private/calendar.json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }
    location /images/ {
        alias /docker/openclaw-xfcd/data/brakefast-public/images/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /legacy/ {
        alias /docker/openclaw-xfcd/data/brakefast-public/editions/;
        try_files $uri $uri/ =404;
    }
    location /archiv/ {
        alias /docker/openclaw-xfcd/data/brakefast-public/editions/archiv/;
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
